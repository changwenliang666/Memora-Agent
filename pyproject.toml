[project]
name = "memora-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WenliangChang", email = "changwenliang666@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "boto3>=1.35.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-mineru>=0.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]
